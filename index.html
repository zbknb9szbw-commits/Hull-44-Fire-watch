<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Hull 44 Fire Watch</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: white;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 16px 10px;
      background: #07111f;
      z-index: 1000;
    }

    .title {
      font-size: 25px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 3px;
      font-size: 13px;
      color: #a9bad1;
    }

    #statusCard {
      margin-top: 12px;
      padding: 13px 14px;
      border-radius: 14px;
      background: #122033;
      border: 1px solid #253b55;
    }

    #statusLine {
      font-size: 19px;
      font-weight: 750;
    }

    #nearest {
      margin-top: 4px;
      font-size: 14px;
      color: #cad6e5;
    }

    #updated {
      margin-top: 3px;
      font-size: 12px;
      color: #8196af;
    }

    #map {
      flex: 1;
      min-height: 350px;
    }

    footer {
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: #07111f;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      font-size: 17px;
      font-weight: 700;
      background: white;
      color: #07111f;
    }

    button:disabled {
      opacity: 0.55;
    }

    .legend {
      margin-top: 8px;
      font-size: 11px;
      color: #91a5bd;
      text-align: center;
    }

    .factory-marker {
      background: #1677ff;
      border: 3px solid white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0,0,0,.5);
    }

    .fire-marker {
      font-size: 24px;
      line-height: 24px;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.7));
    }
  </style>
</head>

<body>

<div id="app">

  <header>
    <div class="title">🔥 Hull 44 Fire Watch</div>
    <div class="subtitle">
      Bali 5.8 • Canet-en-Roussillon, France
    </div>

    <div id="statusCard">
      <div id="statusLine">Connecting to NASA FIRMS…</div>
      <div id="nearest">Checking for recent satellite fire detections.</div>
      <div id="updated"></div>
    </div>
  </header>

  <div id="map"></div>

  <footer>
    <button id="refreshButton" onclick="loadFires()">
      Refresh NASA Fire Data
    </button>

    <div class="legend">
      NASA FIRMS satellite thermal detections • VIIRS NOAA-20 + NOAA-21
    </div>
  </footer>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  /*
  ============================================================
  NASA FIRMS KEY

  Paste your NASA FIRMS MAP_KEY between the quotation marks.
  Do not remove the quotation marks.
  ============================================================
  */

  const FIRMS_MAP_KEY = "PASTE_YOUR_NASA_KEY_HERE";


  /*
  ============================================================
  CATANA / BALI SHIPYARD

  Approximate monitoring point:
  Zone Technique du Port
  Canet-en-Roussillon, France

  We can fine-tune this later to the exact Hull 44 building.
  ============================================================
  */

  const FACTORY_LAT = 42.696;
  const FACTORY_LON = 3.035;


  // Monitor roughly 100 km around the shipyard.
  const BOX = {
    west: 1.8,
    south: 41.8,
    east: 4.2,
    north: 43.6
  };


  const map = L.map("map").setView(
    [FACTORY_LAT, FACTORY_LON],
    8
  );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    }
  ).addTo(map);


  const factoryIcon = L.divIcon({
    className: "",
    html: '<div class="factory-marker"></div>',
    iconSize: [20,20],
    iconAnchor: [10,10]
  });


  L.marker(
    [FACTORY_LAT, FACTORY_LON],
    { icon: factoryIcon }
  )
  .addTo(map)
  .bindPopup(
    "<b>Hull 44 / Bali Shipyard</b><br>Canet-en-Roussillon, France"
  );


  L.circle(
    [FACTORY_LAT, FACTORY_LON],
    {
      radius: 16093,
      color: "#ff3b30",
      fillOpacity: 0.02
    }
  )
  .addTo(map)
  .bindTooltip("10 mile danger zone");


  L.circle(
    [FACTORY_LAT, FACTORY_LON],
    {
      radius: 40234,
      color: "#ff9500",
      fillOpacity: 0.015
    }
  )
  .addTo(map)
  .bindTooltip("25 mile watch zone");


  const fireLayer = L.layerGroup().addTo(map);


  function milesBetween(lat1, lon1, lat2, lon2) {

    const R = 3958.8;

    const toRad = x => x * Math.PI / 180;

    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);

    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(lat1)) *
      Math.cos(toRad(lat2)) *
      Math.sin(dLon / 2) ** 2;

    const c =
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );

    return R * c;
  }


  function parseCSV(text) {

    const lines =
      text.trim()
      .split(/\r?\n/);

    if (lines.length < 2) {
      return [];
    }

    const headers =
      lines[0]
      .split(",")
      .map(x => x.trim());


    return lines.slice(1).map(line => {

      const values = line.split(",");

      const row = {};

      headers.forEach((header, index) => {
        row[header] =
          values[index]
          ? values[index].replace(/^"|"$/g,"").trim()
          : "";
      });

      return row;

    });

  }


  async function getSensorData(sensor) {

    const coords =
      `${BOX.west},${BOX.south},${BOX.east},${BOX.north}`;

    const url =
      `https://firms.modaps.eosdis.nasa.gov/api/area/csv/` +
      `${FIRMS_MAP_KEY}/${sensor}/${coords}/1`;

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error(
        `NASA returned ${response.status}`
      );
    }

    const text = await response.text();

    return parseCSV(text);
  }


  async function loadFires() {

    const button =
      document.getElementById("refreshButton");

    const status =
      document.getElementById("statusLine");

    const nearestText =
      document.getElementById("nearest");

    const updated =
      document.getElementById("updated");


    if (
      FIRMS_MAP_KEY ===
      "l1O9mbnzMqklspIjdKqHhHQ7LdFUhatrJFQwxXWe"
    ) {

      status.innerHTML =
        "⚠️ NASA key needed";

      nearestText.innerHTML =
        "Paste your FIRMS MAP_KEY into the code first.";

      return;
    }


    button.disabled = true;

    button.innerText =
      "Checking NASA satellites…";

    status.innerHTML =
      "🛰️ Checking NASA FIRMS…";

    nearestText.innerHTML =
      "Downloading the latest detections.";

    fireLayer.clearLayers();


    try {

      /*
      Query BOTH currently useful VIIRS feeds.
      */

      const results =
        await Promise.allSettled([

          getSensorData(
            "VIIRS_NOAA20_NRT"
          ),

          getSensorData(
            "VIIRS_NOAA21_NRT"
          )

        ]);


      let fires = [];


      results.forEach(result => {

        if (result.status === "fulfilled") {
          fires =
            fires.concat(result.value);
        }

      });


      /*
      Remove duplicate detections.
      */

      const unique = new Map();

      fires.forEach(fire => {

        const key =
          `${fire.latitude}-` +
          `${fire.longitude}-` +
          `${fire.acq_date}-` +
          `${fire.acq_time}`;

        unique.set(key, fire);

      });

      fires =
        Array.from(unique.values());


      const processed = [];


      fires.forEach(fire => {

        const lat =
          parseFloat(fire.latitude);

        const lon =
          parseFloat(fire.longitude);

        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lon)
        ) {
          return;
        }


        const distance =
          milesBetween(
            FACTORY_LAT,
            FACTORY_LON,
            lat,
            lon
          );


        fire.distance = distance;

        processed.push(fire);


        let emoji = "🔥";

        if (distance <= 10) {
          emoji = "🚨";
        }
        else if (distance <= 25) {
          emoji = "🔥";
        }
        else {
          emoji = "🟠";
        }


        const icon =
          L.divIcon({
            className: "",
            html:
              `<div class="fire-marker">${emoji}</div>`,
            iconSize: [28,28],
            iconAnchor: [14,14]
          });


        const confidence =
          fire.confidence || "—";

        const satellite =
          fire.satellite || "VIIRS";

        const brightness =
          fire.bright_ti4 ||
          fire.brightness ||
          "—";


        L.marker(
          [lat, lon],
          { icon }
        )
        .addTo(fireLayer)
        .bindPopup(

          `<b>NASA Fire / Thermal Detection</b><br>` +

          `Distance from Hull 44: ` +
          `<b>${distance.toFixed(1)} miles</b><br>` +

          `Detected: ` +
          `${fire.acq_date || ""} ` +
          `${fire.acq_time || ""} UTC<br>` +

          `Satellite: ${satellite}<br>` +

          `Confidence: ${confidence}<br>` +

          `Brightness: ${brightness}`

        );

      });


      processed.sort(
        (a,b) =>
          a.distance - b.distance
      );


      if (processed.length === 0) {

        status.innerHTML =
          "✅ No recent NASA detections";

        nearestText.innerHTML =
          "No VIIRS fire/thermal hotspots were found in the monitored area.";

      }

      else {

        const nearest =
          processed[0];

        const d =
          nearest.distance;


        if (d <= 10) {

          status.innerHTML =
            "🚨 DANGER — FIRE VERY CLOSE";

        }

        else if (d <= 25) {

          status.innerHTML =
            "⚠️ FIRE WATCH";

        }

        else {

          status.innerHTML =
            "✅ No nearby fire threat";

        }


        nearestText.innerHTML =

          `Nearest NASA detection: ` +
          `<strong>${d.toFixed(1)} miles</strong>` +

          `<br>` +

          `${processed.length} satellite detection` +

          `${processed.length === 1 ? "" : "s"} ` +

          `in monitored region.`;

      }


      updated.innerHTML =
        "Last checked: " +
        new Date()
        .toLocaleString();


    }

    catch(error) {

      console.error(error);

      status.innerHTML =
        "⚠️ NASA connection problem";

      nearestText.innerHTML =
        "Fire data could not be downloaded. Tap Refresh to try again.";

    }

    finally {

      button.disabled = false;

      button.innerText =
        "Refresh NASA Fire Data";

    }

  }


  /*
  Automatically check NASA when app opens.
  */

  loadFires();


  /*
  Refresh every 15 minutes while the app remains open.
  */

  setInterval(
    loadFires,
    15 * 60 * 1000
  );

</script>

</body>
</html>
